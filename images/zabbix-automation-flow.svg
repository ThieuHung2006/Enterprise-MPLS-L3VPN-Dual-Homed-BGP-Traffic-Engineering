<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 610" width="1060" height="610" font-family="Inter, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Event-driven monitoring and forensics pipeline: Zabbix, Python/Netmiko, Telegram</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="1" y="1" width="1058" height="608" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="530" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Event-driven monitoring &amp; forensics pipeline</text>

  <!-- ZABBIX container -->
  <rect x="30" y="70" width="280" height="490" rx="14" fill="#fdf2f2" stroke="#d9534f" stroke-width="2"/>
  <text x="170" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#b02a26">Zabbix Server 7.0</text>
  <text x="170" y="109" text-anchor="middle" font-size="11" fill="#6b7280">Docker · Alpine Linux</text>

  <g filter="url(#shadow)">
    <rect x="60" y="120" width="220" height="70" rx="10" fill="#ffffff" stroke="#d9534f" stroke-width="1.5"/>
    <rect x="60" y="270" width="220" height="70" rx="10" fill="#ffffff" stroke="#d9534f" stroke-width="1.5"/>
    <rect x="60" y="420" width="220" height="70" rx="10" fill="#ffffff" stroke="#d9534f" stroke-width="1.5"/>
  </g>
  <text x="170" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">SNMP poller</text>
  <text x="170" y="170" text-anchor="middle" font-size="11" fill="#6b7280">interface &amp; BGP peer state</text>
  <text x="170" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Trigger engine</text>
  <text x="170" y="320" text-anchor="middle" font-size="11" fill="#6b7280">state not Established → High</text>
  <text x="170" y="450" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Action runner</text>
  <text x="170" y="470" text-anchor="middle" font-size="11" fill="#6b7280">two operations per event</text>

  <!-- internal arrows -->
  <line x1="170" y1="190" x2="170" y2="268" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="182" y="234" font-size="11" fill="#6b7280">evaluate</text>
  <line x1="170" y1="340" x2="170" y2="418" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="182" y="384" font-size="11" fill="#6b7280">fire event</text>

  <!-- CISCO -->
  <g filter="url(#shadow)">
    <rect x="790" y="70" width="240" height="140" rx="14" fill="#eaf2fb" stroke="#1b6ca8" stroke-width="2"/>
    <rect x="808" y="125" width="95" height="55" rx="8" fill="#ffffff" stroke="#1b6ca8" stroke-width="1.5"/>
    <rect x="917" y="125" width="95" height="55" rx="8" fill="#ffffff" stroke="#1b6ca8" stroke-width="1.5"/>
  </g>
  <text x="910" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#14507d">Cisco MPLS fabric</text>
  <text x="855" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">PE1_HN</text>
  <text x="964" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">P1_Core</text>

  <!-- PYTHON -->
  <g filter="url(#shadow)">
    <rect x="470" y="400" width="220" height="110" rx="12" fill="#ecfdf3" stroke="#1e8449" stroke-width="2"/>
  </g>
  <text x="580" y="432" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Python + Netmiko</text>
  <text x="580" y="454" text-anchor="middle" font-size="12" fill="#1f2937">bgp_forensic.py</text>
  <text x="580" y="478" text-anchor="middle" font-size="11" fill="#6b7280">runs inside the Zabbix container</text>

  <!-- TELEGRAM -->
  <g filter="url(#shadow)">
    <rect x="790" y="400" width="240" height="110" rx="12" fill="#eaf6fd" stroke="#2aabee" stroke-width="2"/>
  </g>
  <text x="910" y="432" text-anchor="middle" font-size="14" font-weight="700" fill="#17709c">Telegram bot</text>
  <text x="910" y="454" text-anchor="middle" font-size="12" fill="#1f2937">NOC channel</text>
  <text x="910" y="478" text-anchor="middle" font-size="11" fill="#6b7280">problem alert + forensic log</text>

  <!-- ARROW 1: SNMP polling (poller -> Cisco) -->
  <line x1="280" y1="155" x2="788" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <circle cx="340" cy="136" r="10" fill="#334155"/>
  <text x="340" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <text x="357" y="141" font-size="13" font-weight="700" fill="#1f2937">SNMP polling</text>
  <text x="357" y="177" font-size="11" fill="#6b7280">ifOperStatus · cbgpPeer2State</text>

  <!-- ARROW 2b: remote command (action runner -> python) -->
  <line x1="280" y1="455" x2="468" y2="455" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <circle cx="334" cy="436" r="10" fill="#334155"/>
  <text x="334" y="440" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">2b</text>
  <text x="350" y="441" font-size="12" font-weight="700" fill="#1f2937">Remote command</text>
  <text x="320" y="478" font-size="11" fill="#6b7280">run on event</text>

  <!-- ARROW 3: SSH (python -> Cisco) -->
  <path d="M580 400 V300 H910 V212" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <circle cx="612" cy="280" r="10" fill="#334155"/>
  <text x="612" y="284" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="629" y="285" font-size="13" font-weight="700" fill="#1f2937">SSH collect</text>
  <text x="629" y="321" font-size="11" fill="#6b7280">BGP summary + syslog</text>

  <!-- ARROW 4: evidence (python -> telegram) -->
  <line x1="690" y1="455" x2="788" y2="455" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <circle cx="710" cy="436" r="10" fill="#334155"/>
  <text x="710" y="440" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
  <text x="726" y="441" font-size="12" font-weight="700" fill="#1f2937">Evidence</text>
  <text x="702" y="478" font-size="11" fill="#6b7280">forensic log</text>

  <!-- ARROW 2a: webhook (action runner -> telegram) -->
  <path d="M170 490 V548 H910 V512" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <circle cx="362" cy="528" r="10" fill="#334155"/>
  <text x="362" y="532" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">2a</text>
  <text x="378" y="533" font-size="12" font-weight="700" fill="#1f2937">Webhook: problem alert</text>

  <!-- footer -->
  <text x="530" y="592" text-anchor="middle" font-size="11" fill="#6b7280">Alert delivery is near-real-time, bounded by the SNMP polling interval.</text>
</svg>
